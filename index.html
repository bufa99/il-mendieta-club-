<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IL.MENDIETA CLUB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #2d2d2d;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    .logo {
      width: 75px;
      height: 75px;
      border: 2px solid #d4af5f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      color: #d4af5f;
      font-size: 22px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #d4af5f;
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 10px;
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d4af5f;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #d4af5f;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .info {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
    }

    .reward {
      margin-top: 20px;
      padding: 15px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      text-align: center;
      color: #d4af5f;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      IM
    </div>

    <h1>IL.MENDIETA CLUB</h1>

    <div class="subtitle">
      CORTÁ • SUMÁ • GANÁ
    </div>

    <form id="registro">

      <label>Nombre</label>

      <input
        type="text"
        id="nombre"
        placeholder="Ingresá tu nombre"
        required
      >

      <label>WhatsApp</label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="Ingresá tu WhatsApp"
        required
      >

      <button type="submit">
        UNIRME AL CLUB
      </button>

    </form>
    <div style="margin-top: 15px;">
  <button type="button" onclick="mostrarAcceso()">
    YA SOY CLIENTE
  </button>
</div>

<div id="acceso" style="display:none; margin-top:25px;">

  <label>WhatsApp</label>

  <input
    type="tel"
    id="whatsappLogin"
    placeholder="Ingresá tu WhatsApp"
  >

  <button type="button" onclick="buscarCliente()">
    VER MIS PUNTOS
  </button>

  <p id="mensajeLogin" style="margin-top:15px; text-align:center;"></p>

</div>
<div style="margin-top: 15px;">
  <button type="button" onclick="mostrarAdmin()">
    🔐 ADMIN
  </button>
</div>

<div id="adminLogin" style="display:none; margin-top:25px;">

  <label>Email</label>

  <input
    type="email"
    id="adminEmail"
    placeholder="Email de administrador"
  >

  <label>Contraseña</label>

  <input
    type="password"
    id="adminPassword"
    placeholder="Contraseña"
  >

  <button type="button" onclick="iniciarAdmin()">
    INGRESAR
  </button>

  <p id="mensajeAdmin" style="margin-top:15px; text-align:center;"></p>

</div>
    <div id="panelAdmin" style="display:none; margin-top:25px;">

  <h2 style="text-align:center; color:#d4af5f; margin-bottom:20px;">
    PANEL ADMIN 🔐
  </h2>

  <label>WhatsApp del cliente</label>

  <input
    type="tel"
    id="whatsappAdmin"
    placeholder="Ingresá el WhatsApp"
  >

  <button type="button" onclick="buscarClienteAdmin()">
    BUSCAR CLIENTE
  </button>

  <div id="resultadoAdmin" style="margin-top:20px;"></div>

</div>
    <div class="info">
      ✂️ Cada corte suma 10 puntos<br>
      📲 Historia etiquetando +5 puntos<br>
      👤 Traer un cliente nuevo +20 puntos
    </div>

    <div class="reward">
      🏆 100 PUNTOS = CORTE GRATIS
    </div>

  </div>

<script>

const SUPABASE_URL = "https://ovhryvknpynztxfmwxmu.supabase.co";
const SUPABASE_KEY = "sb_publishable_Lvw2QdaNOP90gnrTCzCB0g_QjoaYdIX";

document.getElementById("registro").addEventListener("submit", async function(event) {

  event.preventDefault();

  const nombre = document.getElementById("nombre").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();

  if (!nombre || !whatsapp) {
    alert("Completá todos los campos.");
    return;
  }

  try {

    const respuesta = await fetch(
      SUPABASE_URL + "/rest/v1/clientes",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          nombre: nombre,
          whatsapp: whatsapp
        })
      }
    );

    if (!respuesta.ok) {

      const error = await respuesta.text();

      console.error(error);

      alert("No pudimos crear tu cuenta. Intentá nuevamente.");

      return;
    }

    alert("REGISTRO EXITOSO 🔥 " + nombre);

    document.getElementById("registro").reset();

  } catch (error) {

    console.error(error);

    alert("No pudimos conectarnos con el servidor.");

  }

});



async function buscarCliente() {

  const whatsapp = document.getElementById("whatsappLogin").value.trim();
  const mensaje = document.getElementById("mensajeLogin");

  if (!whatsapp) {
    mensaje.textContent = "Ingresá tu WhatsApp.";
    return;
  }

  try {

    const respuesta = await fetch(
      SUPABASE_URL +
      "/rest/v1/clientes?whatsapp=eq." +
      encodeURIComponent(whatsapp) +
      "&select=id,nombre,whatsapp,puntos",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const clientes = await respuesta.json();

    if (!clientes.length) {
      mensaje.textContent = "No encontramos un cliente con ese WhatsApp.";
      return;
    }

    const cliente = clientes[0];

 const respuestaMovimientos = await fetch(
  SUPABASE_URL +
  "/rest/v1/movimientos?cliente_id=eq." +
  cliente.id +
  "&select=accion,puntos,created_at&order=created_at.desc",
  {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }
  }
);

const movimientos = await respuestaMovimientos.json();

let historialHTML = "";

if (movimientos.length === 0) {

  historialHTML = `
    <p style="color:#888; margin-top:20px;">
      Todavía no tenés movimientos.
    </p>
  `;

} else {

  historialHTML = `
    <div style="margin-top:25px; text-align:left;">

      <h3 style="color:#d4af5f; margin-bottom:15px;">
        HISTORIAL
      </h3>

      ${movimientos.map(movimiento => `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:12px 0;
          border-bottom:1px solid #292929;
        ">

          <span>
            ${movimiento.accion}
          </span>

          <strong style="color:#d4af5f;">
            ${movimiento.puntos > 0 ? "+" : ""}${movimiento.puntos} puntos
          </strong>

        </div>
      `).join("")}

    </div>
  `;

}

mensaje.innerHTML = `
  <div style="
    margin-top: 20px;
    padding: 20px;
    background: #101010;
    border: 1px solid #d4af5f;
    border-radius: 16px;
    text-align: center;
  ">

    <h2 style="color:#d4af5f; margin-bottom:10px;">
      ¡Hola ${cliente.nombre}! 👋
    </h2>

    <p style="font-size:32px; font-weight:bold; margin:10px 0;">
      ${cliente.puntos}
      <span style="font-size:14px; color:#aaa;">PUNTOS</span>
    </p>

    <div style="
      width:100%;
      height:12px;
      background:#292929;
      border-radius:20px;
      overflow:hidden;
      margin:20px 0 10px;
    ">

      <div style="
        width:${Math.min(cliente.puntos, 100)}%;
        height:100%;
        background:#d4af5f;
        border-radius:20px;
      "></div>

    </div>

    <p style="color:#aaa;">
      Te faltan ${Math.max(100 - cliente.puntos, 0)} puntos para tu corte gratis ✂️
    </p>

    ${historialHTML}

  </div>
`;
  } catch (error) {

    console.error(error);
    mensaje.textContent = "No pudimos consultar tus puntos.";

  }

}
function mostrarAcceso() {

  document.getElementById("acceso").style.display = "block";
}
  function mostrarAdmin() {

  document.getElementById("adminLogin").style.display = "block";

}


async function iniciarAdmin() {

  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const mensaje = document.getElementById("mensajeAdmin");

  if (!email || !password) {

    mensaje.textContent = "Completá email y contraseña.";
    return;

  }

  try {

    const respuesta = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const datos = await respuesta.json();

    if (!respuesta.ok) {

      console.error(datos);

      mensaje.textContent = "Email o contraseña incorrectos.";
      return;

    }

    localStorage.setItem("admin_token", datos.access_token);

    mensaje.textContent = "¡Acceso correcto! 🔥";

    setTimeout(function() {

      mostrarPanelAdmin();

    }, 500);

  } catch (error) {

    console.error(error);

    mensaje.textContent = "No pudimos conectar con el servidor.";

  }
}
function mostrarPanelAdmin() {

  document.getElementById("adminLogin").style.display = "none";

  document.getElementById("panelAdmin").style.display = "block";

}
</script>
</body>
</html>
